<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Knewave&family=Oi&family=Tiny5&display=swap" rel="stylesheet">
    <style>
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }
        canvas {
            border: 1px solid #e576c9;
            background-color: #3c128e;
        }
        .center-content {
            margin-top: 20px;
        }
        .games-page {
            background: url('/static/neon.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }
        #gameOverImage {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .controls {
            margin-top: 10px;
        }
        .neon-button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: none;
            border: 2px solid #88d9eb;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: color 0.3s;
        }
        .neon-button:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #e576c9, #88d9eb, #e576c9);
            opacity: 1;
            filter: blur(10px);
            z-index: -1;
            transition: opacity 0.3s;
        }
        .neon-button:hover {
            color: #88d9eb;
        }
        .neon-button:hover:before {
            opacity: 0.7;
        }
    </style>
</head>
<body class="games-page">
    <header class="glitch-header">
        <h1 class="glitch" data-text="GAMES">GAMES</h1>
    </header>
    <main>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <img id="gameOverImage" src="/static/gameover.png" alt="Game Over">
        <div class="controls">
            <button id="pauseButton" class="neon-button">Pause</button>
            <button id="startOverButton" class="neon-button">Start Over</button>
        </div>
        <script>
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const pauseButton = document.getElementById('pauseButton');
            const startOverButton = document.getElementById('startOverButton');

            const box = 20;
            let snake = [];
            snake[0] = { x: 9 * box, y: 10 * box };

            let food = {
                x: Math.floor(Math.random() * 19 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };

            let score = 0;
            let d;
            let game;
            let isPaused = false;

            const backgroundMusic = new Audio("static/retro-game-music.mp3");
            backgroundMusic.loop = true; 
            backgroundMusic.volume = 0.3;

            document.addEventListener('keydown', direction);
            pauseButton.addEventListener('click', togglePause);
            startOverButton.addEventListener('click', startOver);

            let gameStarted = false;
            
            function direction(event) {
                if (!gameStarted) {
                    backgroundMusic.play(); 
                    gameStarted = true;
                }
                if (isPaused) return;
                let key = event.keyCode;
                if (key == 37 && d != 'RIGHT') {
                    d = 'LEFT';
                } else if (key == 38 && d != 'DOWN') {
                    d = 'UP';
                } else if (key == 39 && d != 'LEFT') {
                    d = 'RIGHT';
                } else if (key == 40 && d != 'UP') {
                    d = 'DOWN';
                }
                event.preventDefault();
            }

            function collision(newHead, snake) {
                for (let i = 0; i < snake.length; i++) {
                    if (newHead.x == snake[i].x && newHead.y == snake[i].y) {
                        return true;
                    }
                }
                return false;
            }

            function draw() {
                if (isPaused) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < snake.length; i++) {
                    ctx.fillStyle = '#e576c9';
                    ctx.strokeStyle = '#88d9eb';
                    ctx.fillRect(snake[i].x, snake[i].y, box, box);
                    ctx.strokeRect(snake[i].x, snake[i].y, box, box);
                }

                ctx.fillStyle = '#88d9eb';
                ctx.fillRect(food.x, food.y, box, box);

                let snakeX = snake[0].x;
                let snakeY = snake[0].y;

                if (d == 'LEFT') snakeX -= box;
                if (d == 'UP') snakeY -= box;
                if (d == 'RIGHT') snakeX += box;
                if (d == 'DOWN') snakeY += box;

                if (snakeX < 0) snakeX = canvas.width - box;
                if (snakeX >= canvas.width) snakeX = 0;

                if (snakeY < 0) snakeY = canvas.height - box;
                if (snakeY >= canvas.height) snakeY = 0;

                if (snakeX == food.x && snakeY == food.y) {
                    score++;
                    food = {
                        x: Math.floor(Math.random() * 19 + 1) * box,
                        y: Math.floor(Math.random() * 19 + 1) * box
                    };
                } else {
                    snake.pop();
                }

                let newHead = { x: snakeX, y: snakeY };

                if (collision(newHead, snake)) {
                    clearInterval(game);
                    gameOver();
                }

                snake.unshift(newHead);

                ctx.fillStyle = '#88d9eb';
                ctx.font = '45px Knewave, serif';
                ctx.fillText(score, 2 * box, 2 * box);
            }

            function gameOver() {
                ctx.drawImage(gameOverImage, canvas.width / 2 - gameOverImage.width / 2, canvas.height / 2 - gameOverImage.height / 2);
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
            }

            function togglePause() {
                isPaused = !isPaused;
                pauseButton.textContent = isPaused ? 'Resume' : 'Pause';
                if (isPaused) {
                    backgroundMusic.pause(); 
                } else {
                    backgroundMusic.play();
                }
            }

            function startOver() {
                isPaused = false;
                pauseButton.textContent = 'Pause';
                gameOverImage.style.display = 'none';
                clearInterval(game);

                snake = [{ x: 9 * box, y: 10 * box }];
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
                score = 0;
                d = null;
                game = setInterval(draw, 100);
                backgroundMusic.play();
            }

            game = setInterval(draw, 100);
        </script>
        <section class="center-content">
            <a href="index.html">
                <button class="neon-button">Go Back to Homepage</button>
            </a>
        </section>
    </main>
    <footer class="page-games">
        <p>&copy; 2025 Estoschweit. All rights reserved.</p>
    </footer>
</body>
</html>
